<html lang="en">
    <head>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="CSS/main.css">
        <link rel="stylesheet" href="CSS/feedback.css">
        <link rel="stylesheet" href="CSS/screenloader.css">
        <link rel="shortcut icon" href="Pics/uc_logo.png" type="image/x-icon">
        <title>Campus Connect</title>
    </head>
    <body>
         <div id="loader-wrapper">
            <img src="Pics/LOGO.png" alt="University of Cebu Logo" class="loader-logo">
            <div class="loader-spinner"></div>
        </div>
        <header>
            <a id="logonav" href="home.html"><img id="logo" src="Pics/LOGO.png" alt="LOGO"></a>
                <nav id="main-nav">
                    <ul>
                        <li><a href="home.html">HOME</a></li>
                        <li><a href="resource.html">RESOURCES</a></li>
                        <li><a href="Events.html">EVENTS</a></li>
                    </ul>
                </nav>
        </header>

        <main>
            <section id="intro">
                <h1>Feedback</h1>
            </section>

            <div class="container">
        <form id="feedbackForm">
            <h2>We value your opinion!</h2>
            <p class="subtitle">Please rate your experience below.</p>

            <div class="rating-group">
                <label>Your Rating</label>
                <div class="stars">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 Stars">★</label>
                    
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4" title="4 Stars">★</label>
                    
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3" title="3 Stars">★</label>
                    
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2" title="2 Stars">★</label>
                    
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1" title="1 Star">★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="comments">Comments</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Tell us what you think..."></textarea>
            </div>

            <button type="submit" id="submitBtn">Submit Feedback</button>
            
            <div id="message" class="hidden"></div>
        </form>
            </div>
        </main>
        
        <footer>
            <hr>

            <p>University of Cebu Main - College of Computer Studies</p>
            <p>For Feedbacks Click <a href="feedback.html">here</a></p>
        </footer>
        <script src="script.js"></script>
        <script src="loader.js"></script>
    </body>
</html>
